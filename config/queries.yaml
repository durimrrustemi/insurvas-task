templates:
  - "call center outsourcing {city}"
  - "BPO {country}"
  - "BPO insurance campaign {country}"
  - "live transfer call center {country}"
  - "outbound call center {city}"
  - "telemarketing company {city}"
  - "insurance call center {country}"
  - "call center services {city} {country}"
  - "outsource call center {country}"
  - "BPO company {city}"
  - "lead generation call center {country}"
  - "final expense call center {country}"
  - "life insurance telemarketing {country}"
  - "call center outsourcing company {city} {country}"
  - "customer service outsourcing {country}"

# Lead vendors sell live transfers and data leads rather than running campaigns
# for you. Interleaved with the BPO templates so even a small run finds both.
vendor_templates:
  - "final expense live transfer vendor {country}"
  - "insurance live transfers for sale {country}"
  - "final expense leads provider {country}"
  - "insurance lead generation company {city}"
  - "pay per call insurance leads {country}"
  - "senior life insurance leads vendor {country}"

max_queries_per_country: 25

# Results from these domains (and their subdomains) are never candidates:
# social sites, job boards and BPO directories mention call centers but aren't one.
exclude_domains:
  - google.com
  - facebook.com
  - linkedin.com
  - twitter.com
  - x.com
  - youtube.com
  - instagram.com
  - tiktok.com
  - wikipedia.org
  - yelp.com
  - glassdoor.com
  - indeed.com
  - jobstreet.com
  - bbb.org
  - crunchbase.com
  - bloomberg.com
  # News and business media write about BPOs but aren't one.
  - usatoday.com
  - inquirer.net
  - forbes.com
  - reuters.com
  - cnbc.com
  - businessinsider.com
  - nytimes.com
  - entrepreneur.com
  - investopedia.com
  - reddit.com
  - quora.com
  - medium.com
  - amazon.com
  - apple.com
  - clutch.co
  - goodfirms.co
  - upwork.com
  - outsourceaccelerator.com
  - philippinescities.com
  - designrush.com
  - themanifest.com
  - g2.com
  - trustpilot.com

# Result titles matching these regexes are listicles or articles, not companies.
exclude_title_patterns:
  - "^(the )?(top|best) \\d+"
  - "\\b(top|best) \\d+ .*(call cent|bpo|outsourc)"
  - "^\\d+ (top|best)\\b"
  - "^(the )?(best|top) .*\\b(companies|providers|agencies)\\b"
