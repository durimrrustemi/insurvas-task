services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurvas
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./config:/app/config
      - ./.cache:/app/.cache
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/insurvas
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@db:5432/insurvas_test
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head
      && uv run python -m app.cli seed --if-empty
      && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      API_URL: http://api:8000
    depends_on:
      - api
    command: pnpm dev --hostname 0.0.0.0

volumes:
  pgdata:
